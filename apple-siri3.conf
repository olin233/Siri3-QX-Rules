# ============================================================
# Siri 3 / iOS 27 Siri AI  —  Quantumult X 分流规则
# 来源：sr_top500_whitelist_ad_siri3.conf 同名段落（已转 QX 语法）
# 说明：默认全部走 PROXY；其中 Apple Relay 两个域名单独走 TCP 节点组 APPLE-TCP
#       依据酷安 koebBryant 教程：Siri 调 ChatGPT 报“无网络”时，把 Apple Relay 拆到 TCP 节点即可
# QX 导入：设置→资源→分流→资源路径填 raw 链接；
#          ⚠ 必须【关闭该资源的「策略偏好」】，否则会被强制成全 PROXY，APPLE-TCP 失效
#          ⚠ 需要在主配置 [policy] 里定义 APPLE-TCP 策略组（见说明）
# ============================================================

# ---- Apple Relay 走 TCP 节点（Siri + ChatGPT 必需）----
HOST,apple-relay.cloudflare.com,APPLE-TCP
HOST,apple-relay.fastly-edge.com,APPLE-TCP

# ---- 其余 Siri / AI / 中继：全部走代理 ----
HOST,guzzoni.apple.com,PROXY
HOST,dejavu.apple.com,PROXY
HOST,sequoia.apple.com,PROXY
